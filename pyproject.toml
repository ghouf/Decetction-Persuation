[project]
name = "decetction-persuation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ghouf", email = "ghoufranebendahmane@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "emoji>=2.16.0",
    "huggingface-hub>=2.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "openai>=3.41.0",
    "pandas>=3.1.0",
    "pyarabic>=0.6.15",
    "python-dotenv>=1.2.4",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[project.scripts]
decetction-persuation = "decetction_persuation:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "vennv",
]
